<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABN Subcontractor Directory</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --abn-navy:      #004974;
    --abn-teal:      #1B93A5;
    --abn-cyan:      #00C7E5;
    --abn-light-cyan:#AFF4FF;
    --abn-pale-teal: #AFDCDF;
    --abn-steel:     #86BCBF;
    --abn-muted:     #6499A2;
    --abn-gray:      #BFBFBF;
    --abn-white:     #FFFFFF;
    --font-heading:  'Montserrat', sans-serif;
    --font-body:     'Inter', sans-serif;
    --abn-gradient:  linear-gradient(135deg, #004974 0%, #1B93A5 55%, #00C7E5 100%);
    --abn-body-gradient: linear-gradient(160deg, #004974 0%, #1B93A5 55%, #6499A2 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    font-weight: 300;
    color: var(--abn-navy);
    background: var(--abn-body-gradient);
    background-attachment: fixed;
    min-height: 100vh;
  }
  @keyframes drift {
    0%   { transform: rotate(45deg) translate(0, 0); }
    50%  { transform: rotate(45deg) translate(-14px, 10px); }
    100% { transform: rotate(45deg) translate(0, 0); }
  }
  @keyframes drift2 {
    0%   { transform: rotate(45deg) translate(0, 0); }
    50%  { transform: rotate(45deg) translate(10px, -8px); }
    100% { transform: rotate(45deg) translate(0, 0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes countUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hero {
    background: white;
    color: var(--abn-navy);
    padding: 28px 48px;
    position: relative;
    overflow: hidden;
    border-bottom: 4px solid transparent;
    border-image: var(--abn-gradient) 1;
  }
  .hero::after {
    content: '';
    position: absolute;
    right: -70px; top: -70px;
    width: 220px; height: 220px;
    border: 6px solid rgba(27,147,165,0.08);
    transform: rotate(45deg);
    animation: drift 12s ease-in-out infinite;
  }
  .hero::before {
    content: '';
    position: absolute;
    right: 100px; bottom: -110px;
    width: 140px; height: 140px;
    border: 5px solid rgba(0,199,229,0.10);
    transform: rotate(45deg);
    animation: drift2 9s ease-in-out infinite;
  }
  .hero-top {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    position: relative;
    z-index: 1;
  }
  .hero-logo {
    height: 42px;
    width: auto;
    display: block;
  }
  .hero-title {
    font-family: var(--font-heading);
    font-size: 1.6rem;
    font-weight: 700;
    background: var(--abn-gradient);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.3px;
  }
  .breadcrumb {
    background: rgba(0,0,0,0.12);
    backdrop-filter: blur(2px);
    padding: 0 48px;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 46px;
    box-shadow: inset 0 -1px 0 rgba(255,255,255,0.08);
  }
  .breadcrumb span, .breadcrumb button {
    font-family: var(--font-heading);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.75);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 6px;
    transition: color 0.15s;
  }
  .breadcrumb button:hover { color: var(--abn-cyan); }
  .breadcrumb .current { color: var(--abn-cyan); cursor: default; }
  .breadcrumb .sep { opacity: 0.35; cursor: default; font-size: 11px; }
  .cc-tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 16px;
    padding: 0 4px;
    border-radius: 3px;
    background: rgba(255,255,255,0.16);
    color: inherit;
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 0.62rem;
    letter-spacing: 0.4px;
    vertical-align: 1px;
  }

  main { padding: 36px 48px 60px; max-width: 1200px; margin: 0 auto; }

  .section-title {
    font-family: var(--font-heading);
    font-size: 1.3rem;
    font-weight: 600;
    color: white;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid rgba(255,255,255,0.35);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Dashboard */
  .stats-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card, .chart-panel {
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 18px 20px;
    color: white;
    animation: fadeInUp 0.45s ease both;
  }
  .stat-card {
    flex: 1 1 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .stat-card .stat-icon { font-size: 1.3rem; margin-bottom: 6px; opacity: 0.9; }
  .stat-card .stat-value {
    font-family: var(--font-heading);
    font-size: 2rem;
    font-weight: 700;
    line-height: 1;
    background: linear-gradient(90deg, #ffffff 0%, var(--abn-light-cyan) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-card .stat-label {
    margin-top: 6px;
    font-size: 0.72rem;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    font-family: var(--font-heading);
    font-weight: 600;
  }
  .chart-panel { flex: 1 1 260px; }
  .chart-panel h4 {
    font-family: var(--font-heading);
    font-size: 0.72rem;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    margin-bottom: 14px;
    font-weight: 600;
  }
  .chart-panel h4 .chart-sub {
    text-transform: none;
    letter-spacing: 0;
    opacity: 0.7;
    font-weight: 400;
  }
  .donut-row { display: flex; align-items: center; gap: 18px; }
  .donut {
    width: 78px; height: 78px;
    border-radius: 50%;
    background: conic-gradient(var(--abn-cyan) 0% var(--pPct), var(--abn-steel) var(--pPct) 100%);
    position: relative;
    flex: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
  }
  .donut::after {
    content: '';
    position: absolute; inset: 13px;
    border-radius: 50%;
    background: #063a52;
  }
  .donut-center {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-heading);
    font-size: 0.8rem;
    font-weight: 700;
    color: white;
  }
  .donut-legend { font-size: 0.8rem; display: flex; flex-direction: column; gap: 8px; }
  .donut-legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; }
  .donut-legend .dot.pref { background: var(--abn-cyan); }
  .donut-legend .dot.back { background: var(--abn-steel); }
  .donut-legend .count { opacity: 0.7; margin-left: 4px; }

  .bar-chart { display: flex; flex-direction: column; gap: 11px; }
  .bar-row { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; }
  .bar-row .bar-label { flex: 0 0 76px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-row .bar-track { flex: 1; height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; }
  .bar-row .bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--abn-teal), var(--abn-cyan)); }
  .bar-row .bar-count { flex: 0 0 18px; text-align: right; font-weight: 600; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  .tile {
    background: white;
    border-radius: 8px;
    padding: 22px;
    cursor: pointer;
    transition: box-shadow 0.2s, transform 0.2s;
    box-shadow: 0 1px 3px rgba(0,73,116,0.08);
    position: relative;
    overflow: hidden;
    animation: fadeInUp 0.4s ease both;
    border-top: 3px solid var(--tile-accent, var(--abn-teal));
  }
  .tile::before {
    content: '';
    position: absolute;
    right: -30px; top: -30px;
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--abn-light-cyan) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.25s;
  }
  .tile:hover {
    box-shadow: 0 10px 24px rgba(0,73,116,0.18);
    transform: translateY(-4px);
  }
  .tile:hover::before { opacity: 0.6; }
  .tile-icon-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }
  .tile-icon {
    font-size: 1.6rem;
    line-height: 1;
    filter: drop-shadow(0 0 0 transparent);
  }
  .tile-icon-badge {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem;
    background: color-mix(in srgb, var(--tile-accent, var(--abn-teal)) 14%, white);
  }
  .tile-icon-badge.country-badge {
    font-family: var(--font-heading);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: var(--tile-accent, var(--abn-navy));
  }
  .tile-arrow {
    color: var(--abn-gray);
    font-size: 1rem;
    transition: transform 0.2s, color 0.2s;
  }
  .tile:hover .tile-arrow { transform: translateX(4px); color: var(--abn-teal); }
  .tile h3 {
    font-family: var(--font-heading);
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--abn-navy);
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
  }
  .tile .meta {
    font-size: 0.82rem;
    color: var(--abn-muted);
    position: relative;
    z-index: 1;
  }
  .tier-mini-bar {
    display: flex;
    gap: 3px;
    margin-top: 10px;
    height: 5px;
    border-radius: 3px;
    overflow: hidden;
    background: #eef2f4;
    position: relative;
    z-index: 1;
  }
  .tier-mini-bar .seg-preferred { background: var(--abn-teal); }
  .tier-mini-bar .seg-backup { background: var(--abn-steel); }

  .tile.add-tile {
    border-top: none;
    border: 2px dashed rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: rgba(255,255,255,0.85);
    font-family: var(--font-heading);
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    min-height: 90px;
    box-shadow: none;
  }
  .tile.add-tile:hover {
    border-color: white;
    color: white;
    background: rgba(255,255,255,0.14);
  }
  .tile.add-tile .plus-circle {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px dashed currentColor;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
  }

  /* Company list */
  .company-card {
    background: white;
    border-radius: 8px;
    border-left: 4px solid var(--abn-pale-teal);
    padding: 20px 24px;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,73,116,0.06);
    animation: fadeInUp 0.35s ease both;
    transition: box-shadow 0.2s;
  }
  .company-card:hover { box-shadow: 0 6px 18px rgba(0,73,116,0.1); }
  .company-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .company-name {
    font-family: var(--font-heading);
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--abn-navy);
  }
  .tier-badge {
    font-family: var(--font-heading);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 12px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .tier-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .tier-badge.preferred { background: linear-gradient(90deg, var(--abn-teal), var(--abn-cyan)); color: white; box-shadow: 0 2px 8px rgba(27,147,165,0.35); }
  .tier-badge.preferred::before { background: white; }
  .tier-badge.backup { background: #eef2f4; color: var(--abn-muted); border: 1px solid var(--abn-gray); }
  .tier-badge.backup::before { background: var(--abn-steel); }

  .company-details {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 8px 20px;
    font-size: 0.87rem;
    color: #445;
  }
  .company-details > div { display: flex; align-items: center; gap: 6px; }
  .company-details .icn { color: var(--abn-teal); display: inline-flex; align-items: center; flex: none; }
  .company-details .label {
    font-weight: 500;
    color: var(--abn-muted);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: none;
  }
  .company-notes {
    margin-top: 12px;
    font-size: 0.85rem;
    color: #555;
    font-style: italic;
    background: #f5f9fb;
    padding: 10px 14px;
    border-radius: 4px;
    border-left: 2px solid var(--abn-pale-teal);
  }
  .company-actions {
    margin-top: 12px;
    display: flex;
    gap: 10px;
  }

  .btn-primary {
    background: var(--abn-navy);
    color: white;
    border: none;
    padding: 11px 22px;
    font-family: var(--font-heading);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .btn-primary:hover {
    background: var(--abn-teal);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(27,147,165,0.35);
  }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: transparent;
    color: var(--abn-navy);
    border: 1.5px solid var(--abn-navy);
    padding: 9px 18px;
    font-family: var(--font-heading);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }
  .btn-secondary:hover { background: var(--abn-navy); color: white; }

  .btn-text {
    background: none;
    border: none;
    color: var(--abn-muted);
    font-family: var(--font-body);
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: underline;
    padding: 4px 0;
  }
  .btn-text:hover { color: var(--abn-navy); }

  .btn-text.danger { color: #b04a4a; }

  .btn-text.on-dark { color: rgba(255,255,255,0.75); }
  .btn-text.on-dark:hover { color: white; }
  .btn-text.on-dark.danger { color: #ffb3b3; }
  .btn-text.on-dark.danger:hover { color: #ff8080; }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: rgba(255,255,255,0.85);
    font-size: 0.95rem;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    border: 1px dashed rgba(255,255,255,0.3);
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,20,30,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal {
    background: white;
    border-radius: 6px;
    padding: 32px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-family: var(--font-heading);
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--abn-navy);
    margin-bottom: 20px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-family: var(--font-heading);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--abn-muted);
    margin-bottom: 6px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #dde5e8;
    border-radius: 3px;
    font-family: var(--font-body);
    font-size: 0.9rem;
    color: var(--abn-navy);
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none;
    border-color: var(--abn-teal);
  }
  .field textarea { resize: vertical; min-height: 60px; }

  .tier-select {
    display: flex;
    gap: 10px;
  }
  .tier-option {
    flex: 1;
    text-align: center;
    padding: 10px;
    border: 1.5px solid #dde5e8;
    border-radius: 3px;
    cursor: pointer;
    font-family: var(--font-heading);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--abn-muted);
    transition: all 0.15s;
  }
  .tier-option.selected.preferred { background: var(--abn-teal); border-color: var(--abn-teal); color: white; }
  .tier-option.selected.backup { background: #eef2f4; border-color: var(--abn-gray); color: var(--abn-navy); }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 24px;
  }
  .confirm-icon {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 6px;
  }
  .confirm-message {
    text-align: center;
    color: #556;
    font-size: 0.9rem;
    line-height: 1.5;
    margin-top: 6px;
  }
  .btn-danger {
    background: #c0392b;
    color: white;
    border: none;
    padding: 11px 22px;
    font-family: var(--font-heading);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .btn-danger:hover {
    background: #a5281a;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(192,57,43,0.35);
  }

  .loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.85); font-size: 0.9rem; }

  /* Auth gate */
  #authGate {
    position: fixed; inset: 0; z-index: 500;
    background: linear-gradient(135deg, var(--abn-navy), var(--abn-teal));
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .auth-card {
    background: white;
    border-radius: 8px;
    padding: 40px 36px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .auth-card h1 {
    font-family: var(--font-heading);
    color: var(--abn-navy);
    font-size: 1.3rem;
    margin-bottom: 6px;
  }
  .auth-card p { color: var(--abn-muted); font-size: 0.85rem; margin-bottom: 24px; }
  .auth-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 12px 18px;
    border: 1.5px solid #dde5e8;
    border-radius: 4px;
    background: white;
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--abn-navy);
    cursor: pointer;
    transition: all 0.15s;
  }
  .auth-btn:hover { border-color: var(--abn-teal); box-shadow: 0 2px 8px rgba(27,147,165,0.2); }
  .auth-btn svg { width: 20px; height: 20px; }
  .auth-error {
    margin-top: 18px;
    color: #b04a4a;
    font-size: 0.85rem;
    line-height: 1.4;
  }
  .auth-loading { color: var(--abn-muted); font-size: 0.9rem; }
  .user-badge {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.85);
  }
  .user-badge button {
    background: none; border: 1px solid rgba(255,255,255,0.4);
    color: white; border-radius: 3px; padding: 3px 10px;
    font-size: 0.72rem; cursor: pointer; font-family: var(--font-body);
  }
  .user-badge button:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>

  <div id="authGate">
    <div class="auth-card">

      if (snap.exists && snap.data() && snap.data().json) {
        data = JSON.parse(snap.data().json);
        if (!data.countries) data.countries = [];
        if (!data.categories) data.categories = [];
        if (!data.companies) data.companies = {};
      } else {
        // Document doesn't exist yet, seed with example data so the layout is visible
        data = exampleData();
        await saveData();
      }
    } catch (e) {
      console.error('Load failed', e);
      data = exampleData();
    }
    loaded = true;
  }

  async function saveData() {
    try {
      await DOC_REF.set({ json: JSON.stringify(data), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    } catch (e) {
      console.error('Save failed', e);
      alert('Could not save changes. Please check your connection and try again.');
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const CONTACT_ICONS = {
    person: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg>',
    phone: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    mail: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>',
    pin: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'
  };

  const CODES = {
    'italy':'IT','portugal':'PT','switzerland':'CH','belgium':'BE','netherlands':'NL',
    'germany':'DE','france':'FR','spain':'ES','austria':'AT','poland':'PL','ireland':'IE',
    'sweden':'SE','denmark':'DK','norway':'NO','finland':'FI','united kingdom':'GB','uk':'GB',
    'czech republic':'CZ','czechia':'CZ','hungary':'HU','romania':'RO','slovakia':'SK',
    'slovenia':'SI','croatia':'HR','greece':'GR','luxembourg':'LU','united states':'US','usa':'US'
  };
  function countryCode(name) {
    return CODES[(name || '').trim().toLowerCase()] || (name || '').replace(/[^a-zA-Z]/g, '').slice(0, 2).toUpperCase() || '??';
  }
  // Kept name for backwards compatibility with existing call sites; returns a plain 2-letter
  // code instead of an emoji flag, since flag emoji render as raw letters on Windows anyway.
  function countryFlag(name) {
    return countryCode(name);
  }
  function countryTag(name) {
    return `<span class="cc-tag">${countryCode(name)}</span>`;
  }
  function categoryIcon(name) {
    const n = (name || '').toLowerCase();
    if (n.includes('electric')) return '⚡';
    if (n.includes('hvac') || n.includes('climate') || n.includes('air')) return '❄️';
    if (n.includes('floor')) return '🧱';
    if (n.includes('plumb') || n.includes('sanitary') || n.includes('pipe')) return '🚰';
    if (n.includes('insulat')) return '🧊';
    if (n.includes('steel') || n.includes('construction')) return '🏗️';
    if (n.includes('sprinkler') || n.includes('fire')) return '🧯';
    if (n.includes('clean')) return '🧽';
    return '🛠️';
  }
  function tierCounts(list) {
    const preferred = list.filter(c => c.tier === 'preferred').length;
    const backup = list.length - preferred;
    return { preferred, backup };
  }
  function tierMiniBar(list) {
    if (!list.length) return '';
    const { preferred, backup } = tierCounts(list);
    const total = preferred + backup;
    const pPct = (preferred / total) * 100;
    const bPct = 100 - pPct;
    return `<div class="tier-mini-bar">${preferred ? `<div class="seg-preferred" style="width:${pPct}%"></div>` : ''}${backup ? `<div class="seg-backup" style="width:${bPct}%"></div>` : ''}</div>`;
  }

  const ACCENTS = ['#1B93A5', '#00C7E5', '#004974', '#86BCBF', '#6499A2'];
  function accentFor(i) { return ACCENTS[i % ACCENTS.length]; }

  function allCompaniesFlat() {
    let all = [];
    Object.keys(data.companies).forEach(k => { all = all.concat(data.companies[k] || []); });
    return all;
  }

  function renderDashboard() {
    const all = allCompaniesFlat();
    const total = all.length;
    const { preferred, backup } = tierCounts(all);
    const pPct = total ? Math.round((preferred / total) * 100) : 0;

    const perCountry = data.countries.map(c => {
      let list = [];
      data.categories.forEach(cat => { list = list.concat(data.companies[companyKey(c, cat)] || []); });
      return { name: c, count: list.length };
    }).sort((a, b) => b.count - a.count).slice(0, 6);
    const maxCount = Math.max(1, ...perCountry.map(p => p.count));

    const barsHtml = perCountry.length ? perCountry.map(p => `
      <div class="bar-row">
        <div class="bar-label">${countryTag(p.name)} ${escapeHtml(p.name)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(p.count / maxCount) * 100}%"></div></div>
        <div class="bar-count">${p.count}</div>
      </div>
    `).join('') : `<div style="font-size:0.8rem; opacity:0.7;">No companies added yet.</div>`;

    return `
      <div class="stats-row">
        <div class="chart-panel" style="animation-delay:0.05s; flex: 1 1 100%;">
          <h4>Top Countries by Coverage <span class="chart-sub">(${preferred} preferred · ${backup} backup)</span></h4>
          <div class="bar-chart">${barsHtml}</div>
        </div>
      </div>
    `;
  }



  function renderBreadcrumb() {
    let html = '';
    if (view.level === 'countries') {
      html = `<span class="current">Countries</span>`;
    } else if (view.level === 'categories') {
      html = `<button onclick="app.goCountries()">Countries</button><span class="sep">›</span><span class="current">${countryTag(view.country)} ${escapeHtml(view.country)}</span>`;
    } else if (view.level === 'companies') {
      html = `<button onclick="app.goCountries()">Countries</button><span class="sep">›</span><button onclick="app.goCategories('${escapeHtml(view.country)}')">${countryTag(view.country)} ${escapeHtml(view.country)}</button><span class="sep">›</span><span class="current">${categoryIcon(view.category)} ${escapeHtml(view.category)}</span>`;
    }
    crumbEl.innerHTML = html;
  }

  function renderCountries() {
    const sortedCountries = [...data.countries].sort((a, b) => a.localeCompare(b));
    let tiles = sortedCountries.map((c, i) => {
      let allCompanies = [];
      data.categories.forEach(cat => { allCompanies = allCompanies.concat(data.companies[companyKey(c, cat)] || []); });
      const total = allCompanies.length;
      const accent = accentFor(i);
      return `<div class="tile" style="animation-delay:${i * 0.04}s; --tile-accent:${accent}" onclick="app.goCategories('${escapeHtml(c)}')">
        <div class="tile-icon-row">
          <span class="tile-icon-badge country-badge">${countryFlag(c)}</span>
          <span class="tile-arrow">→</span>
        </div>
        <h3>${escapeHtml(c)}</h3>
        <div class="meta">${total} ${total === 1 ? 'company' : 'companies'} across ${data.categories.length} ${data.categories.length === 1 ? 'trade' : 'trades'}</div>
        ${tierMiniBar(allCompanies)}
      </div>`;
    }).join('');

    mainEl.innerHTML = `
      <div class="section-title">Countries</div>
      ${renderDashboard()}
      <div class="grid">
        ${tiles}
        <div class="tile add-tile" onclick="app.showAddCountry()"><span class="plus-circle">+</span> Add Country</div>
      </div>
      ${sortedCountries.length === 0 ? '<div class="empty-state">🌍 No countries yet. Add your first one above.</div>' : ''}
    `;
  }

  function renderCategories() {
    const country = view.country;
    const sortedCategories = [...data.categories].sort((a, b) => a.localeCompare(b));
    let tiles = sortedCategories.map((cat, i) => {
      const list = data.companies[companyKey(country, cat)] || [];
      const accent = accentFor(i);
      return `<div class="tile" style="animation-delay:${i * 0.04}s; --tile-accent:${accent}" onclick="app.goCompanies('${escapeHtml(country)}', '${escapeHtml(cat)}')">
        <div class="tile-icon-row">
          <span class="tile-icon-badge">${categoryIcon(cat)}</span>
          <span class="tile-arrow">→</span>
        </div>
        <h3>${escapeHtml(cat)}</h3>
        <div class="meta">${list.length} ${list.length === 1 ? 'company' : 'companies'}</div>
        ${tierMiniBar(list)}
      </div>`;
    }).join('');

    mainEl.innerHTML = `
      <div class="section-title">
        <span>${countryTag(country)} ${escapeHtml(country)} — Trades</span>
        <button class="btn-text on-dark danger" style="text-decoration:none; font-size:0.75rem;" onclick="app.confirmDeleteCountry('${escapeHtml(country)}')">Remove country</button>
      </div>
      <div class="grid">
        ${tiles}
        <div class="tile add-tile" onclick="app.showAddCategory()"><span class="plus-circle">+</span> Add Trade Category</div>
      </div>
    `;
  }

  function renderCompanies() {
    const { country, category } = view;
    const list = data.companies[companyKey(country, category)] || [];
    // sort preferred first
    const sorted = [...list].sort((a, b) => (a.tier === 'preferred' ? 0 : 1) - (b.tier === 'preferred' ? 0 : 1));

    let cards = sorted.map((comp, i) => `
      <div class="company-card tier-${comp.tier}" style="animation-delay:${i * 0.05}s">
        <div class="company-card-top">
          <div class="company-name">${escapeHtml(comp.company)}</div>
          <div class="tier-badge ${comp.tier}">${comp.tier === 'preferred' ? 'Preferred' : 'Backup'}</div>
        </div>
        <div class="company-details">
          ${comp.contact ? `<div><span class="icn">${CONTACT_ICONS.person}</span>${escapeHtml(comp.contact)}</div>` : ''}
          ${comp.phone ? `<div><span class="icn">${CONTACT_ICONS.phone}</span>${escapeHtml(comp.phone)}</div>` : ''}
          ${comp.email ? `<div><span class="icn">${CONTACT_ICONS.mail}</span>${escapeHtml(comp.email)}</div>` : ''}
          ${comp.city ? `<div><span class="icn">${CONTACT_ICONS.pin}</span>${escapeHtml(comp.city)}</div>` : ''}
        </div>
        ${comp.notes ? `<div class="company-notes">${escapeHtml(comp.notes)}</div>` : ''}
        <div class="company-actions">
          <button class="btn-text" onclick='app.editCompany("${comp.id}")'>Edit</button>
          <button class="btn-text danger" onclick='app.deleteCompany("${comp.id}")'>Remove</button>
        </div>
      </div>
    `).join('');

    mainEl.innerHTML = `
      <div class="section-title">
        <span>${escapeHtml(country)} — ${categoryIcon(category)} ${escapeHtml(category)}</span>
        <button class="btn-primary" onclick="app.showAddCompany()">+ Add Company</button>
      </div>
      ${cards || '<div class="empty-state">🗂️ No companies added yet for this trade.</div>'}
    `;
  }

  function render() {
    renderBreadcrumb();
    if (view.level === 'countries') renderCountries();
    else if (view.level === 'categories') renderCategories();
    else if (view.level === 'companies') renderCompanies();
  }

  function showModal(html) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modal-overlay';
    overlay.innerHTML = `<div class="modal">${html}</div>`;
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
    document.body.appendChild(overlay);
  }
  function closeModal() {
    const el = document.getElementById('modal-overlay');
    if (el) el.remove();
  }
  function showConfirm(message, onConfirm, confirmLabel) {
    showModal(`
      <div class="confirm-icon">⚠️</div>
      <h2 style="text-align:center;">Are you sure?</h2>
      <p class="confirm-message">${escapeHtml(message)}</p>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn-secondary" onclick="app.closeModal()">Cancel</button>
        <button class="btn-danger" id="confirm-yes-btn">${escapeHtml(confirmLabel || 'Remove')}</button>
      </div>
    `);
    document.getElementById('confirm-yes-btn').addEventListener('click', () => {
      closeModal();
      onConfirm();
    });
  }

  const app = {
    goCountries() { view = { level: 'countries', country: null, category: null }; render(); },
    goCategories(country) { view = { level: 'categories', country, category: null }; render(); },
    goCompanies(country, category) { view = { level: 'companies', country, category }; render(); },

    showAddCountry() {
      showModal(`
        <h2>Add Country</h2>
        <div class="field">
          <label>Country name</label>
          <input type="text" id="f-country" placeholder="e.g. Germany" autofocus>
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" onclick="app.closeModal()">Cancel</button>
          <button class="btn-primary" onclick="app.saveCountry()">Add</button>
        </div>
      `);
      setTimeout(() => document.getElementById('f-country').focus(), 50);
    },
    async saveCountry() {
      const name = document.getElementById('f-country').value.trim();
      if (!name) return;
      if (data.countries.some(c => c.toLowerCase() === name.toLowerCase())) { alert('That country is already in the list.'); return; }
      data.countries.push(name);
      await saveData();
      closeModal();
      render();
    },
    confirmDeleteCountry(country) {
      showConfirm(`Remove ${country} and all its subcontractor entries? This cannot be undone.`, () => {
        data.countries = data.countries.filter(c => c !== country);
        data.categories.forEach(cat => { delete data.companies[companyKey(country, cat)]; });
        saveData();
        app.goCountries();
      });
    },

    showAddCategory() {
      showModal(`
        <h2>Add Trade Category</h2>
        <div class="field">
          <label>Category name</label>
          <input type="text" id="f-category" placeholder="e.g. Piping, Insulation, Sprinkler" autofocus>
        </div>
        <p style="font-size:0.8rem; color:var(--abn-muted); margin-top:-8px; margin-bottom:16px;">This will be available across all countries.</p>
        <div class="modal-actions">
          <button class="btn-secondary" onclick="app.closeModal()">Cancel</button>
          <button class="btn-primary" onclick="app.saveCategory()">Add</button>
        </div>
      `);
      setTimeout(() => document.getElementById('f-category').focus(), 50);
    },
    async saveCategory() {
      const name = document.getElementById('f-category').value.trim();
      if (!name) return;
      if (data.categories.some(c => c.toLowerCase() === name.toLowerCase())) { alert('That category already exists.'); return; }
      data.categories.push(name);
      await saveData();
      closeModal();
      render();
    },

    showAddCompany() {
      showModal(`
        <h2>Add Company</h2>
        <div class="field"><label>Company name</label><input type="text" id="f-company" autofocus></div>
        <div class="field"><label>Contact person</label><input type="text" id="f-contact"></div>
        <div class="field"><label>Phone</label><input type="text" id="f-phone"></div>
        <div class="field"><label>Email</label><input type="text" id="f-email"></div>
        <div class="field"><label>City</label><input type="text" id="f-city"></div>
        <div class="field">
          <label>Tier</label>
          <div class="tier-select">
            <div class="tier-option preferred selected" id="tier-preferred" onclick="app.selectTier('preferred')">⭐ Preferred</div>
            <div class="tier-option backup" id="tier-backup" onclick="app.selectTier('backup')">🔁 Backup</div>
          </div>
        </div>
        <div class="field"><label>Notes</label><textarea id="f-notes"></textarea></div>
        <div class="modal-actions">
          <button class="btn-secondary" onclick="app.closeModal()">Cancel</button>
          <button class="btn-primary" onclick="app.saveCompany()">Add</button>
        </div>
      `);
      app._editingId = null;
      app._selectedTier = 'preferred';
    },

    editCompany(id) {
      const { country, category } = view;
      const list = data.companies[companyKey(country, category)] || [];
      const comp = list.find(c => c.id === id);
      if (!comp) return;
      showModal(`
        <h2>Edit Company</h2>
        <div class="field"><label>Company name</label><input type="text" id="f-company" value="${escapeHtml(comp.company)}"></div>
        <div class="field"><label>Contact person</label><input type="text" id="f-contact" value="${escapeHtml(comp.contact || '')}"></div>
        <div class="field"><label>Phone</label><input type="text" id="f-phone" value="${escapeHtml(comp.phone || '')}"></div>
        <div class="field"><label>Email</label><input type="text" id="f-email" value="${escapeHtml(comp.email || '')}"></div>
        <div class="field"><label>City</label><input type="text" id="f-city" value="${escapeHtml(comp.city || '')}"></div>
        <div class="field">
          <label>Tier</label>
          <div class="tier-select">
            <div class="tier-option preferred ${comp.tier === 'preferred' ? 'selected' : ''}" id="tier-preferred" onclick="app.selectTier('preferred')">⭐ Preferred</div>
            <div class="tier-option backup ${comp.tier === 'backup' ? 'selected' : ''}" id="tier-backup" onclick="app.selectTier('backup')">🔁 Backup</div>
          </div>
        </div>
        <div class="field"><label>Notes</label><textarea id="f-notes">${escapeHtml(comp.notes || '')}</textarea></div>
        <div class="modal-actions">
          <button class="btn-secondary" onclick="app.closeModal()">Cancel</button>
          <button class="btn-primary" onclick="app.saveCompany()">Save</button>
        </div>
      `);
      app._editingId = id;
      app._selectedTier = comp.tier;
    },

    selectTier(tier) {
      app._selectedTier = tier;
      document.getElementById('tier-preferred').classList.toggle('selected', tier === 'preferred');
      document.getElementById('tier-backup').classList.toggle('selected', tier === 'backup');
    },

    async saveCompany() {
      const company = document.getElementById('f-company').value.trim();
      if (!company) { alert('Company name is required.'); return; }
      const record = {
        id: app._editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2, 7)),
        company,
        contact: document.getElementById('f-contact').value.trim(),
        phone: document.getElementById('f-phone').value.trim(),
        email: document.getElementById('f-email').value.trim(),
        city: document.getElementById('f-city').value.trim(),
        notes: document.getElementById('f-notes').value.trim(),
        tier: app._selectedTier || 'preferred'
      };
      const key = companyKey(view.country, view.category);
      if (!data.companies[key]) data.companies[key] = [];
      if (app._editingId) {
        const idx = data.companies[key].findIndex(c => c.id === app._editingId);
        if (idx > -1) data.companies[key][idx] = record;
      } else {
        data.companies[key].push(record);
      }
      await saveData();
      closeModal();
      render();
    },

    deleteCompany(id) {
      showConfirm('Remove this company from the list?', () => {
        const key = companyKey(view.country, view.category);
        data.companies[key] = (data.companies[key] || []).filter(c => c.id !== id);
        saveData();
        render();
      });
    },

    closeModal() { closeModal(); }
  };

  window.app = app;
})();
</script>
</body>
</html>
